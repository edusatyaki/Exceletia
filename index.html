<!DOCTYPE html>
<!--
  ════════════════════════════════════════════════════════════════════════════
   FOREST EXPLORER  —  interactive 3D forest walk (Three.js r136)
  ════════════════════════════════════════════════════════════════════════════

  A third-person scene where you guide a realistic human explorer through an
  endless, torch-lit forest toward a stone castle, with a river beyond it.

  CONTROLS
    • W / A / S / D  or  Arrow keys ... move (absolute compass directions:
                                        ↑ North, ↓ South, ← West, → East)
    • Mouse drag .................... orbit / look around
    • F ............................. toggle the hand torch
    • T ............................. toggle day / night
    • M ............................. open the world map (unlocks after walking)

  KEY SYSTEMS (search the matching banner comments below to jump to each)
    • CHARACTER   — Soldier.glb: a textured, rigged human whose baked
                    Idle / Walk clips give a natural human gait.
    • GROUND      — a flat plane that FOLLOWS the player while its texture
                    scrolls by world position → an effectively infinite floor.
    • GRASS       — 1.2M instanced blades, wrapped around the player in-shader
                    (each blade tiles to its world cell) → infinite grass,
                    with wind sway + trample-bend around the character.
    • FOREST      — instanced trunks/branches + a leaf point-cloud canopy.
    • CASTLE      — procedural stone keep with towers, a wooden door, drawbridge
                    and torches; its walls are solid collision obstacles.
    • RIVER       — animated water plane beyond the castle (acts as a boundary).
    • COLLISION   — trees + castle walls + river registered as obstacles; the
                    player slides along them (axis-separated movement).
    • AUDIO       — procedural cricket ambience via the Web Audio API.
    • DAY/NIGHT   — lighting/fog lerp between two presets.
    • MAP         — Vue-rendered SVG world map with an animated flight path.

  DEPENDENCIES (loaded from CDNs): Three.js r136, Vue 2.6 (map overlay only).
  ════════════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forest Explorer</title>
  <link href="https://fonts.googleapis.com/css?family=Oswald:200,300,500" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.6.14/vue.min.js"></script>
  <style>
    body { margin:0; overflow:hidden; background:#050a04; font-family:'Segoe UI',sans-serif; user-select:none; }

    #ui { position:absolute; bottom:26px; width:100%; display:flex; justify-content:center; pointer-events:none; z-index:10; opacity:0; transition:opacity 1s; }

    .ctrl-group { display:flex; gap:16px; font-size:11.5px; color:#7aaa50; letter-spacing:1px; }

    /* Loading / start */
    #loading, #start-screen {

    }
    #loading { background:#040804; }
    #start-screen { background:rgba(0,0,0,0.68); backdrop-filter:blur(16px); visibility:hidden; opacity:0; }
    #loading-text { font-size:12px; color:#6a9840; text-transform:uppercase; letter-spacing:5px; margin-bottom:20px; opacity:.9; }
    .prog-wrap { width:300px; height:2px; background:rgba(100,160,60,0.12); border-radius:1px; overflow:hidden; }
    #prog-bar { width:0%; height:100%; background:linear-gradient(to right,#2a6010,#7ab648); transition:width .12s; }
    #start-screen h2 { margin-bottom:10px; color:#c8e0a0; font-weight:300; letter-spacing:8px; text-transform:uppercase; font-size:20px; }
    #start-screen p  { margin-bottom:26px; color:#5a8030; font-size:11.5px; letter-spacing:2px; }
    #start-btn {
      padding:13px 46px; font-size:12.5px; letter-spacing:3px; color:#c8e0a0;

  </style>
</head>
<body>

<div id="loading">
  <div id="loading-text">Loading forest character…</div>
  <div class="prog-wrap"><div id="prog-bar"></div></div>
</div>
<div id="start-screen">
  <h2>The Forest Awaits</h2>
  <p>WASD · Move &nbsp;|&nbsp; Mouse · Look &nbsp;|&nbsp; F · Torch &nbsp;|&nbsp; T · Day / Night</p>

</div>
<div id="toast">🗺️ Map unlocked — Press M</div>

<div id="map-modal">
  <div class="map-content">
    <div id="map-app">

        <path class="region-shape" fill="#1a2a5a" d="M450,50 Q650,20 800,150 T850,350 T600,300 T450,150 Z"/>

          <path d="M21 15.984l-8.016-2.484v5.484l2.016 1.5v1.5l-3.516-0.984-3.469 0.984v-1.5l1.969-1.5v-5.484l-7.969 2.484v-1.969l7.969-5.016v-5.484c0-0.844 0.656-1.5 1.5-1.5s1.5 0.656 1.5 1.5v5.484l8.016 5.016v1.969z" transform="translate(-16,-15) scale(1.6)"></path>

</div>

<div id="ui">
  <div class="glass-bar">
    <h1>Forest</h1>
    <div class="ctrl-group">
      <span><b>WASD</b>Move</span>

<script type="module">
import * as THREE      from 'https://esm.sh/three@0.136.0';
import { GLTFLoader }  from 'https://esm.sh/three@0.136.0/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'https://esm.sh/three@0.136.0/examples/jsm/controls/OrbitControls.js';

// ── CONFIG ──────────────────────────────────────────────
const GRASS_COUNT  = 1_200_000;
const WORLD_SIZE   = 160;
const GRASS_H      = 0.70;
const TREE_COUNT   = 650;
const CLEAR_R      = 15;
const LEAVES_PER_TREE = 200;
const SPEED        = 1.6;

// Character model URLs.
// Michelle.glb (the preferred, better-looking human) is primary. She only ships a
// dance clip, so we IGNORE her clips and drive a custom procedural walk on her
// Mixamo skeleton instead — she walks like a person and never dances.
// Soldier.glb is the fallback (uses its own Idle/Walk clips).
const MODEL_URLS = [
  'https://threejs.org/examples/models/gltf/Michelle.glb',
  'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r136/examples/models/gltf/Soldier.glb',
];

// ── STATE ────────────────────────────────────────────────
let character, mixer, idleAction, walkAction;
let isWalking = false, torchOn = false;
let mapUnlocked = false, mapOpen = false;
let distWalked = 0;
let groundGeo, groundPos;
let isMichelle = false; // track which model loaded

// ── PROCEDURAL WALK RIG ──────────────────────────────────
let proceduralWalk = false;
let walkPhase = 0, walkBlend = 0;
const bones = {};      // name → THREE.Bone
const baseRot = {};    // name → {x,y,z} rest rotation

// ── COLLISION ────────────────────────────────────────────
const CHAR_RADIUS = 0.5;
const treeColliders = [];  // {x, z, r}  (tree trunks)
const wallColliders = [];  // {minX, maxX, minZ, maxZ}  (walls / water, world AABBs)

// True if a point would collide with any obstacle (radius pre-baked into colliders)
function isBlocked(x, z){
  for(let i=0;i<treeColliders.length;i++){
    const c=treeColliders[i];
    const dx=x-c.x, dz=z-c.z;
    if(dx*dx+dz*dz < c.r*c.r) return true;
  }
  for(let i=0;i<wallColliders.length;i++){
    const w=wallColliders[i];
    if(x>w.minX && x<w.maxX && z>w.minZ && z<w.maxZ) return true;
  }
  return false;
}

// ── DOM ──────────────────────────────────────────────────
const loadingEl  = document.getElementById('loading');
const loadTxt    = document.getElementById('loading-text');
const startEl    = document.getElementById('start-screen');
const uiEl       = document.getElementById('ui');
const toastEl    = document.getElementById('toast');
const mapModal   = document.getElementById('map-modal');
const progBar    = document.getElementById('prog-bar');

// ── RENDERER ─────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.physicallyCorrectLights = true;
document.body.appendChild(renderer.domElement);

// ── SCENE / CAMERA ───────────────────────────────────────
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 600);
camera.position.set(0, 2.8, 7);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI/2 - 0.04;
controls.minDistance = 1.8; controls.maxDistance = 11;
controls.enablePan = false;

// ── DAY / NIGHT ──────────────────────────────────────────
const nightCfg = {
  fog:   new THREE.Color(0x040906),
  hSky:  new THREE.Color(0x0c1a10), hGnd: new THREE.Color(0x030603), hInt: 0.30,
  dCol:  new THREE.Color(0x5a7890), dInt: 0.50, dPos: new THREE.Vector3(25,55,-25),
};
const dayCfg = {
  fog:   new THREE.Color(0x2a4a1e),
  hSky:  new THREE.Color(0x608050), hGnd: new THREE.Color(0x182210), hInt: 0.85,
  dCol:  new THREE.Color(0xfff6d8), dInt: 2.8,  dPos: new THREE.Vector3(55,110,35),
};
let isNight = true, tgtCfg = nightCfg;

scene.fog = new THREE.FogExp2(nightCfg.fog, 0.024);
scene.background = nightCfg.fog.clone();

const hemi = new THREE.HemisphereLight(nightCfg.hSky, nightCfg.hGnd, nightCfg.hInt);
scene.add(hemi);
const sun  = new THREE.DirectionalLight(nightCfg.dCol, nightCfg.dInt);
sun.position.copy(nightCfg.dPos);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near = 5; sun.shadow.camera.far = 180;
sun.shadow.camera.left = sun.shadow.camera.bottom = -WORLD_SIZE/2;
sun.shadow.camera.right = sun.shadow.camera.top   =  WORLD_SIZE/2;
sun.shadow.bias = -0.0005;
scene.add(sun);

// Subtle fill light from below (forest floor bounce)
const fillLight = new THREE.PointLight(0x204010, 0.6, 30);
fillLight.position.set(0, 0.5, 0);
scene.add(fillLight);

// ── TORCH ─────────────────────────────────────────────
const torchSpot  = new THREE.SpotLight(0xffddaa, 0, 65, Math.PI/4.8, 0.5, 1.6);
torchSpot.castShadow = true; torchSpot.shadow.mapSize.set(1024,1024); torchSpot.shadow.bias=-0.001;
const torchPt    = new THREE.PointLight(0xffcc88, 0, 6);
const torchTgt   = new THREE.Object3D();

// ── TERRAIN ─────────────────────────────────────────────
function hash(n){ return (Math.sin(n)*43758.5453123)%1; }
function noise(x,z){
  const px=Math.floor(x),pz=Math.floor(z),fx=x-px,fz=z-pz;
  const ux=fx*fx*(3-2*fx),uz=fz*fz*(3-2*fz);
  const a=hash(px+pz*57),b=hash(px+1+pz*57),c=hash(px+(pz+1)*57),d=hash(px+1+(pz+1)*57);
  return a+ux*(b-a)+uz*((c+ux*(d-c))-(a+ux*(b-a)));
}
// Flat ground so the infinite, player-following floor + wrapped grass stay aligned.
function terrain(x,z){ return 0; }

// ═══════════════════════════════════════════════════════
//  PROCEDURAL TEXTURES
// ═══════════════════════════════════════════════════════
function makeBarkTex(){
  const c=document.createElement('canvas'); c.width=128; c.height=512;
  const x=c.getContext('2d');
  x.fillStyle='#120800'; x.fillRect(0,0,128,512);
  // Vertical grain streaks
  for(let i=0;i<90;i++){
    const r=20+Math.random()*30, g=10+Math.random()*15, b=2+Math.random()*5;
    const a=0.25+Math.random()*0.5;
    x.strokeStyle=`rgba(${r},${g},${b},${a})`;
    x.lineWidth=0.4+Math.random()*2.5;
    x.beginPath();
    let px=Math.random()*128;
    x.moveTo(px,0);
    for(let y=0;y<=512;y+=20+Math.random()*20){
      px=Math.max(0,Math.min(127,px+(Math.random()-.5)*10));
      x.lineTo(px,y);
    }
    x.stroke();
  }
  // Horizontal cracks
  for(let i=0;i<25;i++){
    x.strokeStyle=`rgba(5,3,1,${0.4+Math.random()*0.4})`;
    x.lineWidth=0.5+Math.random()*1.5;
    const py=Math.random()*512;
    x.beginPath(); x.moveTo(0,py);
    for(let px2=0;px2<=128;px2+=12){
      x.lineTo(px2,py+(Math.random()-.5)*5);
    }
    x.stroke();
  }
  // Highlight (light from above)
  const g2=x.createLinearGradient(0,0,128,0);
  g2.addColorStop(0,'rgba(60,35,10,0)');
  g2.addColorStop(0.35,'rgba(80,50,15,0.15)');
  g2.addColorStop(0.6,'rgba(60,35,10,0)');
  x.fillStyle=g2; x.fillRect(0,0,128,512);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,5);
  return t;
}

function makeLeafSpriteTex(){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,1,32,32,28);
  g.addColorStop(0,  'rgba(60,140,25,1)');
  g.addColorStop(0.4,'rgba(45,115,20,0.9)');
  g.addColorStop(0.75,'rgba(28,85,14,0.55)');
  g.addColorStop(1,  'rgba(0,0,0,0)');
  x.fillStyle=g;
  x.beginPath(); x.arc(32,32,28,0,Math.PI*2); x.fill();
  return new THREE.CanvasTexture(c);
}

function makeMossTex(){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const x=c.getContext('2d');
  x.fillStyle='#080f05'; x.fillRect(0,0,256,256);
  for(let i=0;i<300;i++){
    const px=Math.random()*256,py=Math.random()*256,r=2+Math.random()*10;
    const h=70+Math.random()*50;
    const g=x.createRadialGradient(px,py,0,px,py,r);
    g.addColorStop(0,`rgba(14,${h},7,0.75)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g; x.fillRect(px-r,py-r,r*2,r*2);
  }
  // Leaf litter
  for(let i=0;i<120;i++){
    x.fillStyle=`rgba(${35+Math.random()*20},${15+Math.random()*10},3,0.35)`;
    const px=Math.random()*256,py=Math.random()*256;
    x.beginPath();
    x.ellipse(px,py,3+Math.random()*7,2+Math.random()*4,Math.random()*Math.PI,0,Math.PI*2);
    x.fill();
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(18,18);
  return t;
}

// ═══════════════════════════════════════════════════════
//  CHARACTER LOADING  (Michelle → Soldier fallback)
// ═══════════════════════════════════════════════════════
const manager = new THREE.LoadingManager();
manager.onProgress = (_,loaded,total)=>{
  progBar.style.width = Math.round(loaded/total*80)+'%';
};
manager.onLoad = ()=>{
  progBar.style.width='90%';
  loadTxt.innerText='Planting 1.2M grass blades…';
  setTimeout(()=>{
    buildWorld();
    progBar.style.width='100%';
    setTimeout(()=>{
      loadingEl.style.opacity='0';
      setTimeout(()=>{ loadingEl.style.visibility='hidden'; startEl.style.visibility='visible'; startEl.style.opacity='1'; },800);
    },200);
  },50);
};

// ═══════════════════════════════════════════════════════
//  CUSTOM ARTICULATED HUMAN  (own rig → clean joint axes,
//  controllable skin tone, real human feet & walk cycle)
// ═══════════════════════════════════════════════════════
let charJoints = {};

function buildCharacter(){
  const root = new THREE.Group();
  const J = {};

  // Materials — skin is WHITISH-YELLOW (pale ivory)
  const skin = new THREE.MeshStandardMaterial({color:0xF1E5C2, roughness:0.7, metalness:0});
  const top  = new THREE.MeshStandardMaterial({color:0x6e3b2c, roughness:0.85}); // tunic
  const short= new THREE.MeshStandardMaterial({color:0x333a4c, roughness:0.9});  // shorts
  const hair = new THREE.MeshStandardMaterial({color:0x281a0c, roughness:0.95});

  const bone=(p,x,y,z)=>{ const g=new THREE.Group(); g.position.set(x,y,z); p.add(g); return g; };
  const seg =(p,total,rad,mat)=>{           // a limb hanging down from the joint
    const g=new THREE.CylinderGeometry(rad*0.9,rad,total,12);
    const m=new THREE.Mesh(g,mat);
    m.position.y=-total/2; m.castShadow=true; m.receiveShadow=true; p.add(m);
    // rounded joint cap (knee/elbow/shoulder ball)
    const cap=new THREE.Mesh(new THREE.SphereGeometry(rad,10,8),mat);
    cap.castShadow=true; p.add(cap); return m;
  };

  // Realistic bare foot: heel, instep, ball + five toes (points +Z forward)
  const makeFoot=(p)=>{
    const f=bone(p,0,0,0);
    const sole =new THREE.Mesh(new THREE.BoxGeometry(0.086,0.045,0.20), skin);
    sole.position.set(0,-0.052,0.05); sole.castShadow=true; f.add(sole);
    const instep=new THREE.Mesh(new THREE.SphereGeometry(0.05,12,10), skin);
    instep.scale.set(0.95,0.85,1.35); instep.position.set(0,-0.022,-0.005); f.add(instep);
    const heel =new THREE.Mesh(new THREE.SphereGeometry(0.045,12,10), skin);
    heel.scale.set(1,0.95,1); heel.position.set(0,-0.04,-0.045); f.add(heel);
    const ball =new THREE.Mesh(new THREE.SphereGeometry(0.042,12,10), skin);
    ball.scale.set(1.05,0.7,1); ball.position.set(0,-0.052,0.115); f.add(ball);
    for(let i=0;i<5;i++){                    // toes, big→little
      const t=new THREE.Mesh(new THREE.SphereGeometry(0.017-i*0.0014,8,6), skin);
      t.scale.set(1,0.82,1.5); t.position.set(-0.031+i*0.0155,-0.054,0.165); f.add(t);
    }
    return f;
  };

  // Hand with palm + fingers + thumb
  const makeHand=(p)=>{
    const h=bone(p,0,0,0);
    const palm=new THREE.Mesh(new THREE.BoxGeometry(0.052,0.075,0.024), skin);
    palm.position.y=-0.042; palm.castShadow=true; h.add(palm);
    for(let i=0;i<4;i++){
      const fg=new THREE.Mesh(new THREE.CylinderGeometry(0.0075,0.0075,0.04,6), skin);
      fg.position.set(-0.019+i*0.0125,-0.09,0); h.add(fg);
    }
    const thumb=new THREE.Mesh(new THREE.CylinderGeometry(0.0085,0.0085,0.032,6), skin);
    thumb.position.set(0.026,-0.048,0.005); thumb.rotation.z=0.7; h.add(thumb);
    return h;
  };

  // PELVIS
  J.pelvis=bone(root,0,0.92,0);
  const hips=new THREE.Mesh(new THREE.BoxGeometry(0.27,0.17,0.18), short);
  hips.castShadow=true; J.pelvis.add(hips);

  // SPINE / TORSO
  J.spine=bone(J.pelvis,0,0.05,0);
  const torso=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.135,0.45,16), top);
  torso.position.y=0.225; torso.castShadow=true; J.spine.add(torso);
  const yoke=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.33,12), top);
  yoke.rotation.z=Math.PI/2; yoke.position.y=0.43; J.spine.add(yoke);

  // NECK / HEAD
  J.chest=bone(J.spine,0,0.45,0);
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.045,0.07,10), skin);
  neck.position.y=0.04; J.chest.add(neck);
  J.head=bone(J.chest,0,0.08,0);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.11,20,16), skin);
  head.scale.set(0.92,1.05,0.95); head.position.y=0.10; head.castShadow=true; J.head.add(head);
  const jaw=new THREE.Mesh(new THREE.SphereGeometry(0.075,14,10), skin);
  jaw.scale.set(0.95,0.82,0.92); jaw.position.set(0,0.05,0.012); J.head.add(jaw);
  const hairCap=new THREE.Mesh(new THREE.SphereGeometry(0.118,18,16,0,Math.PI*2,0,Math.PI*0.6), hair);
  hairCap.scale.set(0.96,1.05,1.02); hairCap.position.y=0.118; J.head.add(hairCap);
  const tail=new THREE.Mesh(new THREE.CylinderGeometry(0.034,0.018,0.17,10), hair);
  tail.position.set(0,0.045,-0.12); tail.rotation.x=0.5; J.head.add(tail);
  const eyeW=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.4});
  const eyeD=new THREE.MeshStandardMaterial({color:0x241608,roughness:0.3});
  [-1,1].forEach(sx=>{
    const w=new THREE.Mesh(new THREE.SphereGeometry(0.018,10,8), eyeW);
    w.scale.set(1,1.1,0.6); w.position.set(sx*0.04,0.1,0.092); J.head.add(w);
    const pu=new THREE.Mesh(new THREE.SphereGeometry(0.009,8,6), eyeD);
    pu.position.set(sx*0.04,0.1,0.102); J.head.add(pu);
    const br=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.006,0.01), hair);
    br.position.set(sx*0.04,0.132,0.094); J.head.add(br);
  });
  const nose=new THREE.Mesh(new THREE.SphereGeometry(0.016,8,6), skin);
  nose.scale.set(0.8,0.9,1.25); nose.position.set(0,0.086,0.105); J.head.add(nose);

  // ARMS
  J.lShoulder=bone(J.chest,-0.20,0.0,0); seg(J.lShoulder,0.28,0.04,skin);
  J.lElbow=bone(J.lShoulder,0,-0.28,0);  seg(J.lElbow,0.25,0.034,skin);
  J.lWrist=bone(J.lElbow,0,-0.25,0);     makeHand(J.lWrist);
  J.rShoulder=bone(J.chest, 0.20,0.0,0); seg(J.rShoulder,0.28,0.04,skin);
  J.rElbow=bone(J.rShoulder,0,-0.28,0);  seg(J.rElbow,0.25,0.034,skin);
  J.rWrist=bone(J.rElbow,0,-0.25,0);     makeHand(J.rWrist);
  J.lShoulder.rotation.z=0.08; J.rShoulder.rotation.z=-0.08;  // arms rest slightly inward

  // LEGS
  J.lHip=bone(J.pelvis,-0.095,-0.05,0); seg(J.lHip,0.45,0.07,skin);
  J.lKnee=bone(J.lHip,0,-0.45,0);       seg(J.lKnee,0.42,0.05,skin);
  J.lAnkle=bone(J.lKnee,0,-0.42,0);     makeFoot(J.lAnkle);
  J.rHip=bone(J.pelvis, 0.095,-0.05,0); seg(J.rHip,0.45,0.07,skin);
  J.rKnee=bone(J.rHip,0,-0.45,0);       seg(J.rKnee,0.42,0.05,skin);
  J.rAnkle=bone(J.rKnee,0,-0.42,0);     makeFoot(J.rAnkle);

  root.position.set(0,0,0);
  scene.add(root);
  character=root; charJoints=J; proceduralWalk=true;

  // Torch carried at the right side
  torchSpot.position.set(0,1.4,0.15); torchTgt.position.set(0,0.7,10);
  torchSpot.target=torchTgt; torchPt.position.set(0,1.4,0.15);
  character.add(torchSpot); character.add(torchTgt); character.add(torchPt);

  sun.target=character; controls.target.set(0,1.0,0);
}

// ── Hand-authored human walk cycle (clean local axes) ──
function updateHumanWalk(moving, delta, elapsed){
  const J=charJoints; if(!J.pelvis) return;
  walkBlend += ((moving?1:0)-walkBlend)*Math.min(1,delta*9);
  if(moving) walkPhase += delta*6.2;        // stride frequency
  const a=walkBlend, s=Math.sin(walkPhase), c=Math.cos(walkPhase);

  // Thighs swing fore/aft (sagittal plane)
  J.lHip.rotation.x =  0.5*s*a;
  J.rHip.rotation.x = -0.5*s*a;
  // Knees flex (foot tucks BACK only), peaking through the swing — never hyperextend
  J.lKnee.rotation.x = (0.55-0.55*Math.cos(walkPhase))*a;
  J.rKnee.rotation.x = (0.55-0.55*Math.cos(walkPhase+Math.PI))*a;
  // Ankles roll for heel-strike / toe-off, keeping the sole near level
  J.lAnkle.rotation.x = (0.16-0.30*s)*a;
  J.rAnkle.rotation.x = (0.16+0.30*s)*a;
  // Arms counter-swing to the legs
  J.lShoulder.rotation.x =  0.45*s*a;
  J.rShoulder.rotation.x = -0.45*s*a;
  // Elbows: gentle natural bend, a touch more on the forward swing
  J.lElbow.rotation.x = -(0.22 + 0.22*Math.max(0, s))*a;
  J.rElbow.rotation.x = -(0.22 + 0.22*Math.max(0,-s))*a;
  // Pelvis bob (twice per stride) + counter-twist + slight roll
  J.pelvis.position.y = 0.92 - Math.abs(c)*0.026*a;
  J.pelvis.rotation.y = -0.10*s*a;
  J.pelvis.rotation.z =  0.035*s*a;
  // Spine counter-rotation of the shoulders
  J.spine.rotation.y = 0.09*s*a;
  J.head.rotation.x = -0.035*Math.abs(s)*a;

  // Calm idle breathing when essentially still
  if(a<0.06){
    const b=Math.sin(elapsed*1.4);
    J.spine.rotation.x = b*0.02;
    J.lShoulder.rotation.x = b*0.025;
    J.rShoulder.rotation.x = b*0.025;
    J.lElbow.rotation.x = -0.2 - Math.max(0,b)*0.04;
    J.rElbow.rotation.x = -0.2 - Math.max(0,b)*0.04;
  }
}

// ── Boot sequence (character is built locally → no network wait) ──
// ═══════════════════════════════════════════════════════
//  REALISTIC CHARACTER  (Soldier.glb — textured human with
//  baked Idle / Walk / Run clips → natural human movement)
// ═══════════════════════════════════════════════════════
const MODEL_URL='https://threejs.org/examples/models/gltf/Soldier.glb';
const FACING_OFFSET=Math.PI;   // Soldier's model faces -Z by default

(function loadCharacter(){
  loadTxt.innerText='Loading character…';
  new GLTFLoader().load(MODEL_URL, gltf=>{
    character=gltf.scene;
    character.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; }});
    scene.add(character);

    // Torch carried by the character
    torchSpot.position.set(0,1.55,0.12); torchTgt.position.set(0,0.8,10);
    torchSpot.target=torchTgt; torchPt.position.set(0,1.55,0.12);
    character.add(torchSpot); character.add(torchTgt); character.add(torchPt);

    // Baked animation clips → real human gait (no procedural rig needed)
    mixer=new THREE.AnimationMixer(character);
    const clips=gltf.animations;
    const find=n=>clips.find(c=>c.name&&c.name.toLowerCase().includes(n));
    idleAction=mixer.clipAction(find('idle')||clips[0]);
    walkAction=mixer.clipAction(find('walk')||clips[3]||clips[1]||clips[0]);
    idleAction.play();
    proceduralWalk=false;
    sun.target=character; controls.target.set(0,1.0,0);

    // Build the world, then reveal the start screen
    progBar.style.width='55%'; loadTxt.innerText='Planting 1.2M grass blades…';
    setTimeout(()=>{
      buildWorld();
      progBar.style.width='100%';
      setTimeout(()=>{
        loadingEl.style.opacity='0';
        setTimeout(()=>{ loadingEl.style.visibility='hidden'; startEl.style.visibility='visible'; startEl.style.opacity='1'; },800);
      },250);
    },60);
  },
  xhr=>{ if(xhr.total) progBar.style.width=Math.round(xhr.loaded/xhr.total*45)+'%'; },
  err=>{ loadTxt.innerText='Character failed to load'; console.error(err); });
})();

// ═══════════════════════════════════════════════════════
//  CASTLE
// ═══════════════════════════════════════════════════════
function buildCastle(){
  // ── Stone texture (canvas-generated brick pattern) ───
  const sc=document.createElement('canvas'); sc.width=sc.height=512;
  const sx=sc.getContext('2d');
  sx.fillStyle='#9a8a70'; sx.fillRect(0,0,512,512);
  const bW=54,bH=30;
  for(let row=0;row<512/bH+2;row++){
    for(let col=-1;col<512/bW+2;col++){
      const off=(row%2)*bW/2;
      const bx=col*bW+off, by=row*bH;
      const br=0.78+Math.random()*0.28;
      sx.fillStyle=`rgb(${Math.floor(158*br)},${Math.floor(140*br)},${Math.floor(110*br)})`;
      sx.fillRect(bx+1,by+1,bW-2,bH-2);
      sx.fillStyle='rgba(65,52,36,0.65)';
      sx.fillRect(bx-1,by,bW+2,2);
      sx.fillRect(bx,by-1,2,bH+2);
    }
  }
  // Add some mossy patches
  for(let i=0;i<60;i++){
    const mx=Math.random()*512,my=Math.random()*512,mr=8+Math.random()*20;
    const mg=sx.createRadialGradient(mx,my,0,mx,my,mr);
    mg.addColorStop(0,'rgba(30,70,20,0.35)'); mg.addColorStop(1,'rgba(0,0,0,0)');
    sx.fillStyle=mg; sx.fillRect(mx-mr,my-mr,mr*2,mr*2);
  }
  const stoneTex=new THREE.CanvasTexture(sc);
  stoneTex.wrapS=stoneTex.wrapT=THREE.RepeatWrapping;

  const stoneMat=new THREE.MeshStandardMaterial({map:stoneTex, roughness:0.96, metalness:0});
  const darkMat =new THREE.MeshStandardMaterial({color:0x0d0a06, roughness:1.0});
  const roofMat =new THREE.MeshStandardMaterial({color:0x4a1610, roughness:0.88});
  const woodMat =new THREE.MeshStandardMaterial({color:0x3a2408, roughness:0.95});

  // Castle sits north of spawn (player walks toward it pressing ↑)
  const CX=0, CZ=-48;
  const CY=terrain(CX,CZ);
  const G=new THREE.Group(); G.position.set(CX,CY,CZ);

  // ── Helpers ──────────────────────────────────────────
  const addMesh=(geo,mat,x,y,z,ry=0)=>{
    const m=new THREE.Mesh(geo,mat);
    m.position.set(x,y,z); m.rotation.y=ry;
    m.castShadow=true; m.receiveShadow=true; G.add(m); return m;
  };
  const BOX=(x,y,z,w,h,d,mat=stoneMat,ry=0)=>{
    stoneTex.repeat.set(w/6, h/6);
    addMesh(new THREE.BoxGeometry(w,h,d),mat,x,y+h/2,z,ry);
  };
  const CYL=(x,y,z,rt,rb,h,mat=stoneMat,seg=14)=>{
    stoneTex.repeat.set(4,h/6);
    addMesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat,x,y+h/2,z);
  };
  const CONE=(x,y,z,r,h,mat=roofMat,seg=14)=>{
    addMesh(new THREE.ConeGeometry(r,h,seg),mat,x,y+h/2,z);
  };

  const HW=17;   // half outer courtyard size
  const WH=8;    // outer wall height
  const WT=2.0;  // wall thickness

  // ── Gravel courtyard ground ───────────────────────────
  addMesh(new THREE.CircleGeometry(HW*1.5,32),
    new THREE.MeshStandardMaterial({color:0x4a3e28,roughness:1}), 0,0.05,0)
    .rotation.x=-Math.PI/2;

  // ── Foundation / base ────────────────────────────────
  BOX(0,-0.5,0, HW*2+WT,1,HW*2+WT, new THREE.MeshStandardMaterial({color:0x3a2e1a,roughness:1}));

  // ── Outer walls ──────────────────────────────────────
  BOX(0,0,-HW,  HW*2+WT, WH, WT);           // north
  BOX(0,0, HW,  HW*2+WT, WH, WT);           // south
  BOX(-HW,0,0,  WT, WH, HW*2-WT);           // west
  BOX( HW,0,0,  WT, WH, HW*2-WT);           // east

  // ── Gate (south wall opening) ─────────────────────────
  BOX(-6.5,0,HW, 8.5,WH,WT);                // south wall left
  BOX( 6.5,0,HW, 8.5,WH,WT);                // south wall right
  BOX(0,WH-2,HW, 5.5,4,WT);                 // lintel above gate
  addMesh(new THREE.BoxGeometry(5,WH-4,WT*1.2), darkMat, 0,(WH-4)/2,HW); // gate opening

  // Portcullis (iron bars)
  for(let i=-2;i<=2;i++){
    addMesh(new THREE.CylinderGeometry(0.08,0.08,WH-4,6),
      new THREE.MeshStandardMaterial({color:0x1a1a1a,metalness:0.8,roughness:0.4}),
      i*1.1,(WH-4)/2,HW-0.1);
  }

  // ── Drawbridge ───────────────────────────────────────
  BOX(0,-0.1,HW+3.5, 4.8,0.25,7, woodMat);
  // Chains
  for(let side of [-2,2]){
    for(let i=0;i<5;i++){
      addMesh(new THREE.TorusGeometry(0.15,0.06,6,8),
        new THREE.MeshStandardMaterial({color:0x3a3020,metalness:0.6,roughness:0.5}),
        side, WH-i*1.2, HW+i*0.7, Math.PI/4);
    }
  }

  // ── Corner towers ────────────────────────────────────
  [[-HW,-HW],[-HW,HW],[HW,-HW],[HW,HW]].forEach(([tx,tz])=>{
    CYL(tx,0,tz, 2.6,3.1,14);             // tower body
    CONE(tx,14,tz, 3.0,5, roofMat);       // conical roof cap
    // Battlements ring
    for(let i=0;i<12;i++){
      const a=i/12*Math.PI*2;
      BOX(tx+Math.cos(a)*3.0, 14, tz+Math.sin(a)*3.0, 0.8,1.6,0.8);
    }
    // Arrow slit windows
    for(let h=4;h<=10;h+=3){
      const a2=Math.atan2(tz<0?-1:1, tx<0?-1:1);
      addMesh(new THREE.BoxGeometry(0.5,2,0.4), darkMat,
        tx-Math.cos(a2)*2.55, h, tz-Math.sin(a2)*2.55, a2);
    }
  });

  // ── Wall battlements ─────────────────────────────────
  for(let i=-HW+1;i<=HW;i+=2.5){
    BOX(i,WH,-HW, 1.0,1.5,1.0);  // north
    BOX(i,WH, HW, 1.0,1.5,1.0);  // south
    BOX(-HW,WH,i, 1.0,1.5,1.0);  // west
    BOX( HW,WH,i, 1.0,1.5,1.0);  // east
  }

  // ── Central keep ─────────────────────────────────────
  BOX(0,0,0, 13,22,13);                      // main body

  // Keep windows — narrow arrow slits on all 4 faces
  [[0,7,-6.6],[0,13,-6.6],[0,7,6.6],[0,13,6.6],
   [-6.6,7,0],[-6.6,13,0],[6.6,7,0],[6.6,13,0]].forEach(([x,y,z])=>{
    addMesh(new THREE.BoxGeometry(1.3,2.8,0.5), darkMat, x,y,z);
  });

  // Keep battlements on top
  for(let i=-5;i<=5;i+=2.5){
    BOX(i,22,-6.5, 1.0,1.8,1.0);
    BOX(i,22, 6.5, 1.0,1.8,1.0);
    BOX(-6.5,22,i, 1.0,1.8,1.0);
    BOX( 6.5,22,i, 1.0,1.8,1.0);
  }

  // Keep pyramid roof (4-sided)
  addMesh(new THREE.CylinderGeometry(0.6,9.5,7,4), roofMat, 0,22+3.5,0);

  // ── Flag pole + flag ─────────────────────────────────
  CYL(0,22+7,0, 0.1,0.1,6,new THREE.MeshStandardMaterial({color:0x2a1a06,roughness:1}),8);
  const flagGeo=new THREE.PlaneGeometry(4,2.2);
  const flagMat=new THREE.MeshStandardMaterial({
    color:0x8b1a1a, side:THREE.DoubleSide, roughness:0.9
  });
  const flag=new THREE.Mesh(flagGeo,flagMat);
  flag.position.set(2,22+7+5.5,0); G.add(flag);
  // Cross on flag
  const crossMat=new THREE.MeshStandardMaterial({color:0xd4a017,side:THREE.DoubleSide});
  [new THREE.PlaneGeometry(3.6,0.45), new THREE.PlaneGeometry(0.45,1.8)].forEach((cg,ci)=>{
    const cm=new THREE.Mesh(cg,crossMat);
    cm.position.set(2,22+7+5.5,ci===0?0.01:0.01); G.add(cm);
  });

  // ── Towers flanking gate (gatehouse) ─────────────────
  [[-4,HW],[4,HW]].forEach(([tx,tz])=>{
    CYL(tx,0,tz,1.8,2.1,11);
    CONE(tx,11,tz,2.2,3.5,roofMat);
    for(let i=0;i<9;i++){
      const a=i/9*Math.PI*2;
      BOX(tx+Math.cos(a)*2.2,11,tz+Math.sin(a)*2.2,0.7,1.3,0.7);
    }
  });

  // ── Torches / lights ─────────────────────────────────
  // Gate torches (warm orange glow)
  [[-4.5,WH-1,HW-0.5],[4.5,WH-1,HW-0.5]].forEach(([x,y,z])=>{
    const pt=new THREE.PointLight(0xff9933,2.5,22); pt.position.set(x,y,z); G.add(pt);
    // Torch mesh (small box + flame sphere)
    addMesh(new THREE.CylinderGeometry(0.1,0.1,0.8,6),woodMat,x,y-0.2,z);
    const flameGeo=new THREE.SphereGeometry(0.22,8,6);
    addMesh(flameGeo,new THREE.MeshStandardMaterial({
      color:0xff8800,emissive:0xff5500,emissiveIntensity:2,transparent:true,opacity:0.85
    }),x,y+0.28,z);
  });
  // Corner tower torches
  [[-HW,11,-HW],[HW,11,-HW],[-HW,11,HW],[HW,11,HW]].forEach(([x,y,z])=>{
    const pt=new THREE.PointLight(0xff9933,1.8,18); pt.position.set(x,y,z); G.add(pt);
  });
  // Keep entrance light
  const keepLight=new THREE.PointLight(0xffcc88,2.0,25);
  keepLight.position.set(0,4,6.8); G.add(keepLight);

  // ── Wooden double door in the gate (swung ajar to invite entry) ──
  const doorMat=new THREE.MeshStandardMaterial({color:0x3a2208, roughness:0.9});
  const ironMat=new THREE.MeshStandardMaterial({color:0x141414, metalness:0.7, roughness:0.45});
  const doorH=WH-4.2, doorW=2.35;
  [[-2.5,-0.95],[2.5,0.95]].forEach(([hingeX,openRot])=>{
    const leaf=new THREE.Group();
    leaf.position.set(hingeX, 0, HW);     // hinge at the gate jamb
    const ox = hingeX<0 ? doorW/2 : -doorW/2;
    const panel=new THREE.Mesh(new THREE.BoxGeometry(doorW,doorH,0.18), doorMat);
    panel.position.set(ox, doorH/2, 0); panel.castShadow=true; leaf.add(panel);
    // vertical plank lines
    for(let p=-1;p<=1;p++){
      const pl=new THREE.Mesh(new THREE.BoxGeometry(0.05,doorH,0.20), ironMat);
      pl.position.set(ox+p*0.7, doorH/2, 0); leaf.add(pl);
    }
    // iron cross-bands + ring handle
    [doorH*0.22, doorH*0.78].forEach(by=>{
      const band=new THREE.Mesh(new THREE.BoxGeometry(doorW,0.16,0.22), ironMat);
      band.position.set(ox, by, 0); leaf.add(band);
    });
    const ring=new THREE.Mesh(new THREE.TorusGeometry(0.18,0.05,6,12), ironMat);
    ring.position.set(ox + (hingeX<0?doorW*0.35:-doorW*0.35), doorH*0.5, 0.12);
    ring.rotation.x=Math.PI/2; leaf.add(ring);
    leaf.rotation.y=openRot;               // swing open
    G.add(leaf);
  });

  scene.add(G);

  // ── Register wall colliders (world AABBs, padded by character radius) ──
  const R=CHAR_RADIUS;
  const aabb=(lx,lz,w,d)=>wallColliders.push({
    minX:CX+lx-w/2-R, maxX:CX+lx+w/2+R,
    minZ:CZ+lz-d/2-R, maxZ:CZ+lz+d/2+R,
  });
  aabb(0,-HW,     HW*2+WT, WT);     // north wall
  aabb(-HW,0,     WT, HW*2-WT);     // west wall
  aabb( HW,0,     WT, HW*2-WT);     // east wall
  aabb(-6.5,HW,   8.5, WT);         // south wall left of gate
  aabb( 6.5,HW,   8.5, WT);         // south wall right of gate
  aabb(0,0,       13, 13);          // central keep
  // (the 5-wide gate gap is intentionally left open so the player can enter)

  buildRiver(CX, CZ - HW - 7);      // river just beyond the castle's north wall
}

// ═══════════════════════════════════════════════════════
//  RIVER  (animated water, beyond the castle)
// ═══════════════════════════════════════════════════════
function buildRiver(rx, rz){
  const W=WORLD_SIZE, D=12;
  const geo=new THREE.PlaneGeometry(W, D, 90, 20);
  geo.rotateX(-Math.PI/2);
  const mat=new THREE.ShaderMaterial({
    transparent:true,
    uniforms:{ time:{value:0} },
    vertexShader:`
      uniform float time; varying float vWave;
      void main(){
        vec3 p=position;
        float w = sin(p.x*0.55+time*1.4)*0.13
                + sin(p.z*0.9 -time*1.0)*0.08
                + sin(p.x*1.7+p.z*1.2+time*2.1)*0.04;
        p.y += w; vWave=w;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
      }`,
    fragmentShader:`
      varying float vWave;
      void main(){
        vec3 deep=vec3(0.02,0.09,0.13);
        vec3 shallow=vec3(0.07,0.24,0.28);
        vec3 col=mix(deep,shallow, smoothstep(-0.15,0.15,vWave));
        col += smoothstep(0.09,0.14,vWave)*vec3(0.25,0.38,0.42); // crests
        gl_FragColor=vec4(col, 0.85);
      }`,
  });
  const water=new THREE.Mesh(geo,mat);
  const wy=terrain(rx,rz)-0.25;
  water.position.set(rx, wy, rz);
  scene.add(water);
  scene._water=mat;

  // Muddy riverbank lip (visual)
  const bank=new THREE.Mesh(
    new THREE.PlaneGeometry(W, 3),
    new THREE.MeshStandardMaterial({color:0x2a2012, roughness:1})
  );
  bank.rotation.x=-Math.PI/2;
  bank.position.set(rx, terrain(rx,rz)+0.02, rz + D/2 + 1.3);
  scene.add(bank);

  // River blocks passage (acts as the northern boundary)
  wallColliders.push({
    minX:-W/2, maxX:W/2,
    minZ:rz - D/2 - 2, maxZ:rz + D/2 + CHAR_RADIUS,
  });
}

// ═══════════════════════════════════════════════════════
//  WORLD BUILDING
// ═══════════════════════════════════════════════════════
function buildWorld(){
  buildGround();
  buildGrass();
  buildForest();
  buildCastle();
}

const GROUND_SIZE = 260;          // large flat patch (fog hides its edge)
const GROUND_TEX_REPEAT = 60;     // moss tiles across the patch
function buildGround(){
  // Flat plane — it follows the player each frame, while its moss texture is
  // offset by the player's world position so the floor appears to scroll past:
  // an effectively infinite ground.
  const mossTex = makeMossTex();
  mossTex.repeat.set(GROUND_TEX_REPEAT, GROUND_TEX_REPEAT);
  const geo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, 1, 1);
  geo.rotateX(-Math.PI/2);
  const mat = new THREE.MeshStandardMaterial({
    map:mossTex, color:0x14210c, roughness:0.98,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  scene.add(mesh);
  scene._ground = mesh;
  scene._groundTex = mossTex;
}

function buildGrass(){
  const bladeGeo = new THREE.PlaneGeometry(0.065, GRASS_H, 1, 3);
  bladeGeo.translate(0, GRASS_H/2, 0);

  const grassMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.65, side:THREE.DoubleSide});
  const FULLP=(WORLD_SIZE).toFixed(1), HALFP=(WORLD_SIZE/2).toFixed(1);
  grassMat.onBeforeCompile = shader=>{
    shader.uniforms.time    = {value:0};
    shader.uniforms.uPlayer = {value:new THREE.Vector2(0,0)};
    shader.vertexShader = `
      uniform float time; uniform vec2 uPlayer; vec2 gWrapOffset;
      attribute vec3 instanceColor; attribute float instanceCurve;
      varying vec3 vColor; varying float vY;
      ${shader.vertexShader}
    `.replace('#include <begin_vertex>',`
      #include <begin_vertex>
      vColor = instanceColor; vY = position.y;
      // ── Infinite wrap: blade's baked base position tiles around the player ──
      vec2 base = vec2(instanceMatrix[3].x, instanceMatrix[3].z);
      vec2 rel  = base - uPlayer;
      vec2 wrapped = mod(rel + ${HALFP}, ${FULLP}) - ${HALFP};
      vec2 worldXZ = uPlayer + wrapped;
      gWrapOffset = worldXZ - base;            // applied after the instance transform
      float h = position.y / ${GRASS_H.toFixed(2)};
      transformed.x *= (1.0 - h*0.88);
      transformed.z += pow(h,2.0)*instanceCurve;
      float d2p = length(wrapped);
      float trmp = 1.0 - smoothstep(0.0, 0.85, d2p);
      if(trmp>0.0){
        vec2 pd = normalize(wrapped + vec2(0.0001));
        transformed.x += pd.x*trmp*h*0.65;
        transformed.z += pd.y*trmp*h*0.65;
        transformed.y -= trmp*h*0.4;
      }
      float wind = sin(time*2.6 + worldXZ.x*0.45+worldXZ.y*0.35)*h*0.12 + sin(time*1.4+worldXZ.x*0.2)*h*0.05;
      transformed.x += wind; transformed.z += wind*0.3;
    `).replace('#include <project_vertex>',`
      vec4 mvPosition = vec4( transformed, 1.0 );
      #ifdef USE_INSTANCING
        mvPosition = instanceMatrix * mvPosition;
      #endif
      mvPosition.xz += gWrapOffset;            // tile blade to its wrapped world cell
      mvPosition = modelViewMatrix * mvPosition;
      gl_Position = projectionMatrix * mvPosition;
    `);
    shader.fragmentShader = `
      varying vec3 vColor; varying float vY;
      ${shader.fragmentShader}
    `.replace('#include <color_fragment>',`
      #include <color_fragment>
      float h=clamp(vY/${GRASS_H.toFixed(2)},0.0,1.0);
      diffuseColor.rgb = mix(vec3(0.008,0.022,0.002), vColor, h*h);
    `);
    grassMat.userData.shader=shader;
  };

  const iMesh = new THREE.InstancedMesh(bladeGeo, grassMat, GRASS_COUNT);
  iMesh.castShadow=false;          // wrapped in-shader; skip shadow pass to avoid mismatch
  iMesh.frustumCulled=false;       // always visible (it follows the player)
  const dummy=new THREE.Object3D();
  const iCol=new Float32Array(GRASS_COUNT*3);
  const iCurv=new Float32Array(GRASS_COUNT);
  const cols=[
    new THREE.Color(0x387218), new THREE.Color(0x2a5a10),
    new THREE.Color(0x4a7820), new THREE.Color(0x1e4008),
    new THREE.Color(0x708828),
  ];
  for(let i=0;i<GRASS_COUNT;i++){
    const x=(Math.random()-.5)*WORLD_SIZE, z=(Math.random()-.5)*WORLD_SIZE;
    const h=terrain(x,z);
    dummy.position.set(x,h,z);
    dummy.rotation.y=Math.random()*Math.PI*2;
    dummy.rotation.x=(Math.random()-.5)*0.1;
    dummy.scale.set(1, 0.72+Math.random()*0.5, 1);
    dummy.updateMatrix();
    iMesh.setMatrixAt(i,dummy.matrix);
    const c=cols[Math.floor(Math.random()*cols.length)].clone();
    if(Math.random()>.75) c.lerp(cols[4],Math.random()*.35);
    iCol[i*3]=c.r; iCol[i*3+1]=c.g; iCol[i*3+2]=c.b;
    iCurv[i]=0.03+Math.random()*0.20;
  }
  iMesh.geometry.setAttribute('instanceColor',new THREE.InstancedBufferAttribute(iCol,3));
  iMesh.geometry.setAttribute('instanceCurve',new THREE.InstancedBufferAttribute(iCurv,1));
  scene.add(iMesh);
  scene._grassMesh=iMesh;
}

function buildForest(){
  const barkTex  = makeBarkTex();
  const leafTex  = makeLeafSpriteTex();

  // ── Trunk geometry ───────────────────────────────────
  // More detailed cylinder with organic displacement
  const trunkGeo = new THREE.CylinderGeometry(0.13, 0.22, 1, 12, 6, false);
  const tp = trunkGeo.attributes.position;
  for(let i=0;i<tp.count;i++){
    const y = tp.getY(i)+0.5; // 0..1
    if(y>0.03&&y<0.97){       // skip top/bottom cap
      const angle=Math.atan2(tp.getZ(i),tp.getX(i));
      const r=Math.sqrt(tp.getX(i)**2+tp.getZ(i)**2);
      // Sinusoidal bumps + random noise for bark texture
      const disp=(Math.sin(angle*6+y*4)*0.022+Math.sin(angle*3-y*7)*0.015+(Math.random()-.5)*0.018)*(1-y*0.4);
      tp.setX(i,(r+disp)*Math.cos(angle));
      tp.setZ(i,(r+disp)*Math.sin(angle));
    }
  }
  trunkGeo.translate(0,0.5,0);
  trunkGeo.computeVertexNormals();

  const trunkMat = new THREE.MeshStandardMaterial({
    map:barkTex, roughness:1.0, metalness:0,
    color:new THREE.Color(0.32,0.18,0.06), // warm tint base
  });

  // ── Branch geometry ──────────────────────────────────
  const branchGeo = new THREE.CylinderGeometry(0.04, 0.09, 1, 7, 2);
  branchGeo.translate(0,0.5,0);
  branchGeo.computeVertexNormals();
  const branchMat = new THREE.MeshStandardMaterial({map:barkTex, roughness:1.0, color:0x1a0c02});

  const BRANCHES_PER_TREE = 5;
  const trunkIM  = new THREE.InstancedMesh(trunkGeo, trunkMat, TREE_COUNT);
  const branchIM = new THREE.InstancedMesh(branchGeo, branchMat, TREE_COUNT*BRANCHES_PER_TREE);
  trunkIM.castShadow=true;  trunkIM.receiveShadow=true;
  branchIM.castShadow=true; branchIM.receiveShadow=true;

  // ── Leaf point cloud ─────────────────────────────────
  const maxLeaves = TREE_COUNT * LEAVES_PER_TREE;
  const leafPos = new Float32Array(maxLeaves*3);
  const leafCol = new Float32Array(maxLeaves*3);
  let   li = 0;

  const dummy = new THREE.Object3D();
  const euler = new THREE.Euler();
  let   bi    = 0; // branch instance index

  const treeData = []; // store positions for collision-free spawn

  // Keep trees out of: spawn clearing, castle footprint, and river band
  const nearCastle=(x,z)=> Math.abs(x)<26 && z>-90 && z<-42;
  const inRiver   =(x,z)=> z<-92 && z>-112;

  for(let i=0;i<TREE_COUNT;i++){
    let tx,tz,tries=0;
    do {
      tx=(Math.random()-.5)*WORLD_SIZE*0.90;
      tz=(Math.random()-.5)*WORLD_SIZE*0.90;
      tries++;
    } while((Math.sqrt(tx*tx+tz*tz)<CLEAR_R || nearCastle(tx,tz) || inRiver(tx,tz)) && tries<60);

    const ty  = terrain(tx,tz);
    const s   = 0.75 + Math.random()*0.95; // height scale
    const tH  = 7.5*s;
    const tilt= (Math.random()-.5)*0.06;
    const rot = Math.random()*Math.PI*2;

    treeData.push({tx,tz,ty,s,tH});
    // Register trunk as an obstacle (trunk base radius ~0.22*s + character radius)
    treeColliders.push({x:tx, z:tz, r:0.22*s + CHAR_RADIUS});

    // Trunk
    dummy.position.set(tx,ty,tz);
    dummy.rotation.set(tilt, rot, (Math.random()-.5)*0.03);
    dummy.scale.set(s, tH, s);
    dummy.updateMatrix();
    trunkIM.setMatrixAt(i, dummy.matrix);

    // Branches — placed at 3 heights, radiating outward
    for(let b=0;b<BRANCHES_PER_TREE;b++){
      const bAngle = rot + (b/BRANCHES_PER_TREE)*Math.PI*2 + (Math.random()-.5)*0.4;
      const bHFrac = 0.28 + (b/BRANCHES_PER_TREE)*0.48; // 28%..76% up trunk
      const bLen   = (0.8+Math.random()*0.8)*s;
      const bTilt  = 0.35+Math.random()*0.4; // elevation angle (rad)
      const bBaseX = tx + Math.cos(bAngle)*0.18*s;
      const bBaseY = ty + tH*bHFrac;
      const bBaseZ = tz + Math.sin(bAngle)*0.18*s;
      dummy.position.set(bBaseX, bBaseY, bBaseZ);
      // Rotate cylinder so it points in the branch direction
      euler.set(-Math.PI/2 + bTilt, 0, bAngle, 'YXZ');
      dummy.rotation.copy(euler);
      dummy.scale.set(s*0.7, bLen, s*0.7);
      dummy.updateMatrix();
      branchIM.setMatrixAt(bi++, dummy.matrix);
    }

    // Leaf cloud — distributed in an ellipsoid around the canopy
    const cBaseY = ty + tH*0.30;
    const cTopY  = ty + tH + 1.0*s;
    const cH     = cTopY - cBaseY;
    const cR     = 2.6*s;

    for(let j=0;j<LEAVES_PER_TREE;j++){
      // Bias toward outer shell (real trees have leaves at extremities)
      const r      = cR*(0.45 + 0.55*Math.pow(Math.random(), 0.35));
      const theta  = Math.random()*Math.PI*2;
      const phiFrac= Math.random(); // 0=bottom, 1=top
      // Upper hemisphere bias
      const phi    = Math.acos(1 - 1.6*phiFrac); // biased upward
      const lx     = tx + r*Math.sin(phi)*Math.cos(theta);
      const lz     = tz + r*Math.sin(phi)*Math.sin(theta);
      const ly     = cBaseY + phiFrac*cH + (Math.random()-.5)*0.8*s;

      if(li >= maxLeaves) break;
      leafPos[li*3]  =lx;
      leafPos[li*3+1]=ly;
      leafPos[li*3+2]=lz;

      // Color: sunlit tips lighter, deep interior darker
      const heightFrac = (ly-cBaseY)/cH;
      const interior   = 1-r/cR;
      const bright     = 0.35 + heightFrac*0.55 - interior*0.25;
      const variation  = 0.85+Math.random()*0.3;
      leafCol[li*3]    = (0.04+Math.random()*.04)*bright*variation;
      leafCol[li*3+1]  = (0.22+Math.random()*.12)*bright*variation;
      leafCol[li*3+2]  = (0.02+Math.random()*.02)*bright*variation;
      li++;
    }
  }

  trunkIM.instanceMatrix.needsUpdate=true;
  branchIM.instanceMatrix.needsUpdate=true;
  scene.add(trunkIM);
  scene.add(branchIM);

  // Leaf Points
  const leafGeo = new THREE.BufferGeometry();
  leafGeo.setAttribute('position',new THREE.BufferAttribute(leafPos.slice(0,li*3),3));
  leafGeo.setAttribute('color',   new THREE.BufferAttribute(leafCol.slice(0,li*3),3));
  const leafMat = new THREE.PointsMaterial({
    size:1.15, map:leafTex, vertexColors:true,
    transparent:true, alphaTest:0.06, depthWrite:false, sizeAttenuation:true,
  });
  scene.add(new THREE.Points(leafGeo, leafMat));

  // ── Ground-level roots / moss mounds at trunk bases ─
  const moundGeo = new THREE.SphereGeometry(1,8,5);
  moundGeo.scale(1,0.25,1);
  const moundMat = new THREE.MeshStandardMaterial({color:0x0a1405, roughness:1.0});
  const moundIM  = new THREE.InstancedMesh(moundGeo, moundMat, TREE_COUNT);
  moundIM.receiveShadow=true;
  treeData.forEach(({tx,tz,ty,s},i)=>{
    dummy.position.set(tx,ty,tz);
    dummy.rotation.set(0,Math.random()*Math.PI,0);
    dummy.scale.setScalar((0.8+Math.random()*.6)*s);
    dummy.updateMatrix();
    moundIM.setMatrixAt(i,dummy.matrix);
  });
  moundIM.instanceMatrix.needsUpdate=true;
  scene.add(moundIM);
}

// ── CRICKET SOUND (Web Audio API procedural) ──────────
function initCrickets(){
  const ctx = new (window.AudioContext||window.webkitAudioContext)();

  // ── Ambient cricket chorus: bandpass-filtered white noise ──
  const bufSize = ctx.sampleRate * 4;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const d   = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) d[i]=Math.random()*2-1;
  const noise = ctx.createBufferSource();
  noise.buffer=buf; noise.loop=true;
  const bp1=ctx.createBiquadFilter(); bp1.type='bandpass'; bp1.frequency.value=4200; bp1.Q.value=20;
  const bp2=ctx.createBiquadFilter(); bp2.type='bandpass'; bp2.frequency.value=3600; bp2.Q.value=18;
  const ng=ctx.createGain(); ng.gain.value=0.022;
  noise.connect(bp1); bp1.connect(ng);
  noise.connect(bp2); bp2.connect(ng);
  ng.connect(ctx.destination);
  noise.start();

  // ── Individual cricket chirp bursts ───────────────────
  function chirp(){
    const t     = ctx.currentTime + 0.02;
    const freq  = 3400 + Math.random()*1400;  // pitch variation per cricket
    const bursts= 2 + Math.floor(Math.random()*3);
    const vol   = 0.03 + Math.random()*0.04;
    for(let i=0;i<bursts;i++){
      const ti=t+i*0.042;
      const osc=ctx.createOscillator();
      // Slight FM modulation for realism
      const modOsc=ctx.createOscillator(); const modG=ctx.createGain();
      modOsc.frequency.value=90; modG.gain.value=180;
      modOsc.connect(modG); modG.connect(osc.frequency);
      const g=ctx.createGain();
      g.gain.setValueAtTime(0,ti);
      g.gain.linearRampToValueAtTime(vol, ti+0.004);
      g.gain.setValueAtTime(vol, ti+0.018);
      g.gain.linearRampToValueAtTime(0,   ti+0.030);
      osc.connect(g); g.connect(ctx.destination);
      modOsc.start(ti); modOsc.stop(ti+0.032);
      osc.start(ti);    osc.stop(ti+0.032);
    }
    setTimeout(chirp, (1.0+Math.random()*3.5)*1000);
  }

  // Stagger 7 independent crickets for natural forest chorus
  for(let i=0;i<7;i++) setTimeout(chirp, Math.random()*5000);
}

// ── START ─────────────────────────────────────────────
const clock=new THREE.Clock();

document.getElementById('start-btn').addEventListener('click',()=>{
  startEl.style.opacity='0';
  uiEl.style.opacity='1';
  torchOn=true;
  torchSpot.intensity=125; torchPt.intensity=16;

  setTimeout(()=>{ startEl.style.visibility='hidden'; clock.start(); animate(); },480);

// ── ANIMATION LOOP ───────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  if(mapOpen) return;

  const delta   = Math.min(clock.getDelta(),0.1);
  const elapsed = clock.getElapsedTime();

  // Lerp day/night
  const lf=0.018;
  scene.fog.color.lerp(tgtCfg.fog,lf); scene.background=scene.fog.color.clone();
  hemi.color.lerp(tgtCfg.hSky,lf); hemi.groundColor.lerp(tgtCfg.hGnd,lf);
  hemi.intensity+=(tgtCfg.hInt-hemi.intensity)*lf;
  sun.color.lerp(tgtCfg.dCol,lf);
  sun.intensity+=(tgtCfg.dInt-sun.intensity)*lf;
  sun.position.lerp(tgtCfg.dPos,lf);

  // Move fill light with character
  if(character) fillLight.position.set(character.position.x, character.position.y+0.5, character.position.z);

  // Grass uniforms (wrap follows the player → infinite grass)
  const gr=scene._grassMesh;
  if(gr&&gr.material.userData.shader){
    const u=gr.material.userData.shader.uniforms;
    u.time.value=elapsed;
    if(character) u.uPlayer.value.set(character.position.x, character.position.z);
  }

  // Infinite ground: flat plane follows player, texture offset = world position
  if(scene._ground && character){
    scene._ground.position.x = character.position.x;
    scene._ground.position.z = character.position.z;
    scene._groundTex.offset.set(
       character.position.x / GROUND_SIZE * GROUND_TEX_REPEAT,
      -character.position.z / GROUND_SIZE * GROUND_TEX_REPEAT
    );
  }

  // River water animation
  if(scene._water) scene._water.uniforms.time.value=elapsed;

  // Mixer
  if(mixer) mixer.update(delta);

  // Movement
  if(character){
    // Absolute world-space directions
    // Up/W = North (-Z), Down/S = South (+Z), Left/A = West (-X), Right/D = East (+X)
    const moveDir=new THREE.Vector3();
    if(keys.w) moveDir.z -= 1;
    if(keys.s) moveDir.z += 1;
    if(keys.a) moveDir.x -= 1;
    if(keys.d) moveDir.x += 1;

    const moving=moveDir.lengthSq()>0;

    // Clip-based animation fallback (Soldier). Procedural rig (Michelle) is driven below.
    if(!proceduralWalk && moving!==isWalking){
      if(moving){ walkAction?.reset().play().crossFadeFrom(idleAction,0.3,true); }
      else       { idleAction?.reset().play().crossFadeFrom(walkAction,0.3,true); }
    }
    isWalking=moving;

    if(moving){
      moveDir.normalize();
      const step=SPEED*delta;
      let px=character.position.x, pz=character.position.z;

      // Axis-separated movement → slides along walls/trees instead of sticking.
      // No world clamp: the ground & grass are infinite, so roaming is unbounded.
      let nx=px+moveDir.x*step;
      if(!isBlocked(nx,pz)) px=nx;
      let nz=pz+moveDir.z*step;
      if(!isBlocked(px,nz)) pz=nz;

      character.position.x=px;
      character.position.z=pz;
      character.position.y=terrain(px,pz);

      distWalked+=step;
      if(distWalked>12&&!mapUnlocked){
        mapUnlocked=true;
        document.getElementById('btn-map').style.display='block';
        toastEl.style.visibility='visible'; toastEl.style.opacity='1';
        setTimeout(()=>{ toastEl.style.opacity='0'; setTimeout(()=>toastEl.style.visibility='hidden',500); },4000);
      }

      // Face the direction of travel (FACING_OFFSET corrects the model's rest facing):
      // up(-Z)=north, down(+Z)=south, left(-X)=west, right(+X)=east.
      const tgtA=Math.atan2(moveDir.x,moveDir.z)+FACING_OFFSET;
      let diff=tgtA-character.rotation.y;
      while(diff<-Math.PI)diff+=Math.PI*2; while(diff>Math.PI)diff-=Math.PI*2;
      character.rotation.y+=diff*10*delta;
    }

    // Hand-authored human walk cycle (legs/arms/torso/feet)
    updateHumanWalk(moving, delta, elapsed);

    controls.target.lerp(
      new THREE.Vector3(character.position.x, character.position.y+1.0, character.position.z), 0.1
    );
    controls.update();
  }

  renderer.render(scene, camera);
}

// ═══════════════════════════════════════════════════════════════════════════
//  TREASURES  (additive feature — 10 collectible gems)
//  Self-contained: waits for the world, builds the gems, runs its own
//  spin/bob/collect loop and HUD. Does not touch any existing code path.
// ═══════════════════════════════════════════════════════════════════════════
(function treasureFeature(){
  const TOTAL = 10;
  const PICKUP_DIST = 1.7;          // how close the explorer must get
  const treasures = [];             // { group, x, z, collected, t0 }
  let collected = 0;
  let audioCtx = null;

  // Hand-placed positions (avoid the spawn point, castle interior & river)
  const SPOTS = [
    [  8,  -6], [ -9, -10], [ 14, -16], [-15, -20], [ 20,  -8],
    [-22, -14], [ 10, -26], [-12, -28], [ 26, -30], [-28, -24],
  ];

  // ── Floating HUD counter (created here, not in existing HTML) ──
  const hud = document.createElement('div');
  hud.id = 'treasure-hud';
  hud.style.cssText = `
    position:absolute; top:18px; left:50%; transform:translateX(-50%);
    background:rgba(8,18,5,0.6); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(210,165,55,0.4); border-radius:40px; padding:8px 22px;
    color:#f0d98a; font-family:'Segoe UI',sans-serif; font-size:13px; font-weight:bold;
    letter-spacing:2px; z-index:12; box-shadow:0 6px 24px rgba(0,0,0,0.6);
    pointer-events:none; opacity:0; transition:opacity .6s;`;
  hud.innerHTML = `✦ TREASURES &nbsp;<span id="t-count">0</span> / ${TOTAL}`;
  document.body.appendChild(hud);

  const banner = document.createElement('div');
  banner.style.cssText = `
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.8);
    background:rgba(8,18,5,0.7); backdrop-filter:blur(16px); border:1px solid rgba(210,165,55,0.5);
    border-radius:16px; padding:26px 46px; color:#f3e0a0; font-family:'Oswald',sans-serif;
    font-size:24px; font-weight:500; letter-spacing:4px; text-transform:uppercase; text-align:center;
    z-index:40; box-shadow:0 12px 50px rgba(0,0,0,0.8); pointer-events:none;
    opacity:0; transition:opacity .5s, transform .5s;`;
  banner.innerHTML = `🏆 All Treasures Collected!`;
  document.body.appendChild(banner);

  // ── A small chime on pickup (Web Audio; gesture already given via "Enter") ──
  function chime(step){
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      const base = 660 * Math.pow(2, step/12);     // rising pitch per pickup
      [0,4,7].forEach((semi,i)=>{                    // little major chord
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        const t = audioCtx.currentTime + i*0.05;
        o.type='triangle'; o.frequency.value = base*Math.pow(2,semi/12);
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.16,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t+0.5);
      });
    }catch(e){/* audio optional */}
  }

  // ── Build one glowing treasure gem ──
  function makeTreasure(x, z){
    const grp = new THREE.Group();
    grp.position.set(x, 0, z);

    // Faceted gold gem
    const gem = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.34, 0),
      new THREE.MeshStandardMaterial({
        color:0xffcc33, emissive:0xc88400, emissiveIntensity:0.9,
        metalness:0.6, roughness:0.25, flatShading:true,
      })
    );
    gem.position.y = 0.85; gem.castShadow = true;
    grp.add(gem);

    // Stone pedestal so it reads as placed treasure
    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(0.26, 0.34, 0.18, 8),
      new THREE.MeshStandardMaterial({color:0x4a4438, roughness:0.95})
    );
    base.position.y = 0.09; base.castShadow = true; base.receiveShadow = true;
    grp.add(base);

    // Warm glow light
    const glow = new THREE.PointLight(0xffb84d, 2.4, 7, 2);
    glow.position.y = 0.9; grp.add(glow);

    scene.add(grp);
    treasures.push({ grp, gem, glow, x, z, collected:false, t0:0 });
  }

  function buildTreasures(){ SPOTS.forEach(([x,z])=>makeTreasure(x,z)); hud.style.opacity='1'; }

  // ── Own animation + pickup loop (independent of the main animate()) ──
  function loop(now){
    requestAnimationFrame(loop);
    const t = now * 0.001;
    for(const tr of treasures){
      if(tr.collected){
        // Collection flourish: rise, spin fast, shrink, then remove
        const k = Math.min(1, (t - tr.t0) / 0.6);
        tr.grp.position.y = k * 1.6;
        tr.gem.rotation.y += 0.4;
        const s = 1 - k;
        tr.grp.scale.setScalar(s <= 0 ? 0.0001 : s);
        if(tr.glow) tr.glow.intensity = 2.4 * (1 - k);
        if(k >= 1 && tr.grp.parent){ scene.remove(tr.grp); tr.grp._done = true; }
        continue;
      }
      // Idle bob + slow spin
      tr.gem.rotation.y += 0.02;
      tr.gem.position.y = 0.85 + Math.sin(t*2 + tr.x) * 0.12;

      // Pickup test against the explorer
      if(typeof character !== 'undefined' && character){
        const dx = character.position.x - tr.x;
        const dz = character.position.z - tr.z;
        if(dx*dx + dz*dz < PICKUP_DIST*PICKUP_DIST){
          tr.collected = true; tr.t0 = t;
          collected++;
          document.getElementById('t-count').textContent = collected;
          chime(collected);
          if(collected >= TOTAL){
            banner.style.opacity = '1';
            banner.style.transform = 'translate(-50%,-50%) scale(1)';
            setTimeout(()=>{ banner.style.opacity='0'; }, 4000);
          }
        }
      }
    }
  }

  // Wait until the world + character exist, then build & start.
  const ready = setInterval(()=>{
    if(typeof scene !== 'undefined' && typeof character !== 'undefined' && character){
      clearInterval(ready);
      buildTreasures();
      requestAnimationFrame(loop);
    }
  }, 200);

})();
